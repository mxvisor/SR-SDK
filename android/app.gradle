// app/build.gradle of the project tools/android_apk.py assembles in
// <build>/android/project/ from SDL's android-project.  The native side is
// built by scons, not here: android_apk.py stages the .so files in
// <build>/android/jniLibs/ and the game's data in <build>/android/assets/game/.
// The game's own values come as -P properties.

apply plugin: 'com.android.application'

layout.buildDirectory = file('../../gradle')

android {
    namespace "io.github.mxvisor.srsdk"
    compileSdkVersion 34
    defaultConfig {
        applicationId project.property('gameApplicationId')
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['../../jniLibs']
        assets.srcDirs = ['../../assets']
    }
    lint {
        abortOnError false
    }
}

dependencies {
}
